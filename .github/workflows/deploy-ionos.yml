name: Deploy zu IONOS

# Baut die App und laedt sie per SFTP ins Webspace-Verzeichnis (/public).
#   main     -> bisherige App unter  /
#   redesign -> neues Design unter   /neu/  (Testphase, Umschalter in der App)
# Laeuft bei jedem Push auf einen der beiden Zweige und kann von Hand gestartet werden.
on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

# Der Workflow braucht nur Lesezugriff aufs Repository.
permissions:
  contents: read

# Je Zweig nur ein Lauf gleichzeitig; die beiden Zweige stoeren sich nicht.
concurrency:
  group: deploy-ionos-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
      SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Zielordner auf dem Webspace
      ZIEL: ${{ github.ref_name == 'redesign' && '/neu' || '/' }}
    steps:
      - name: Pruefen, ob alle Secrets hinterlegt sind
        id: secrets
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ] || [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Es fehlen GitHub-Secrets - Deploy wird uebersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Bauen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ "$ZIEL" = "/neu" ]; then
            npm run build -- --base=/neu/
            # Seiten-Fallback der Single-Page-App auf den Unterordner umbiegen
            sed -i -e 's#^  RewriteBase /$#  RewriteBase /neu/#' \
                   -e 's#^  RewriteRule \. /index\.html \[L\]$#  RewriteRule . /neu/index.html [L]#' dist/.htaccess
            grep -n 'RewriteBase\|index.html' dist/.htaccess
            grep -q 'RewriteRule . /neu/index.html' dist/.htaccess
          else
            npm run build
          fi

      - name: Per SFTP hochladen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Leerzeichen/Zeilenumbrueche aus Benutzer und Host entfernen; das
          # Passwort laeuft ueber ein Skript, damit Sonderzeichen nicht stoeren.
          SFTP_USER="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"
          SFTP_HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]')"
          PW="$(printf '%s' "$SFTP_PASSWORD" | tr -d '\r\n' | sed 's/[\\"]/\\&/g')"
          SKRIPT="$RUNNER_TEMP/lftp-deploy.txt"
          {
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 2"
            echo "set net:timeout 30"
            echo "open -p 22 sftp://$SFTP_HOST"
            echo "user \"$SFTP_USER\" \"$PW\""
            echo "mirror -R --parallel=4 --verbose dist/ $ZIEL"
            echo "bye"
          } > "$SKRIPT"
          lftp -f "$SKRIPT"
          rm -f "$SKRIPT"
